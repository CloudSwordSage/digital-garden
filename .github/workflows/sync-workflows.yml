name: Sync Workflows To Branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: sync-workflows-to-branches
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync workflows to v4 and docs
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --prune

          for target_branch in v4 docs; do
            worktree_path="$(mktemp -d)"
            git worktree add --detach "$worktree_path" "origin/${target_branch}"

            mkdir -p "$worktree_path/.github/workflows"
            rsync -a --delete ".github/workflows/" "$worktree_path/.github/workflows/"

            cd "$worktree_path"
            git checkout -B "$target_branch" "origin/${target_branch}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows

            if git diff --cached --quiet; then
              echo "No workflow changes for ${target_branch}."
              cd "$GITHUB_WORKSPACE"
              git worktree remove --force "$worktree_path"
              continue
            fi

            git commit -m "ci: sync workflows from main"
            git push origin "HEAD:${target_branch}"

            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$worktree_path"
          done
