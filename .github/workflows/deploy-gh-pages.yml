name: Deploy Quartz Site

on:
  push:
    branches:
      - docs
      - v4

concurrency:
  group: deploy-quartz-site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync docs branch into content
        shell: bash
        run: |
          set -euo pipefail

          docs_worktree_path="$(mktemp -d)"
          git fetch origin --prune
          git worktree add --detach "$docs_worktree_path" origin/docs

          mkdir -p content

          # Merge docs branch payload into content without deleting v4-only documents.
          rsync -a --exclude='.*' --exclude='*/.*' "$docs_worktree_path"/ content/

          git worktree remove --force "$docs_worktree_path"

      - name: Build Quartz site
        run: npx quartz build

      - name: Publish public to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          publish_worktree_path="$(mktemp -d)"
          git fetch origin --prune

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add --detach "$publish_worktree_path" origin/gh-pages
            (
              cd "$publish_worktree_path"
              git checkout -B gh-pages origin/gh-pages
            )
          else
            git worktree add --detach "$publish_worktree_path" HEAD
            (
              cd "$publish_worktree_path"
              git checkout --orphan gh-pages
            )
          fi

          cname_backup_path=""
          if [ -f "$publish_worktree_path/CNAME" ]; then
            cname_backup_path="$(mktemp)"
            cp "$publish_worktree_path/CNAME" "$cname_backup_path"
          fi

          find "$publish_worktree_path" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a public/. "$publish_worktree_path"/

          if [ -n "$cname_backup_path" ]; then
            cp "$cname_backup_path" "$publish_worktree_path/CNAME"
            rm -f "$cname_backup_path"
          fi

          cd "$publish_worktree_path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No changes to publish."
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$publish_worktree_path"
            exit 0
          fi

          git commit -m "deploy: publish quartz site"
          git push origin "HEAD:gh-pages" --force

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$publish_worktree_path"
